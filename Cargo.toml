[workspace]
members = ["crates/core-protocol", "crates/saber-core"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
authors = ["SunArthur"]
license-file = "LICENSE"
repository = "https://github.com/SunArthurX/saber-harness"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
