name: Repository Verification

on:
  pull_request:
  push:
    branches:
      - main
      - "segment/**"

permissions:
  contents: read

concurrency:
  group: repository-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-verification:
    name: repository-verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify repository contract
        run: node scripts/verify-s00.mjs
      - name: Verify S01 constitution and traceability
        run: node scripts/verify-s01.mjs
      - name: Verify S02 monorepo and CI contract
        run: node scripts/verify-s02.mjs
      - name: Verify S03 schema and protocol contract
        run: node scripts/verify-s03.mjs
      - name: Verify S04 encrypted event-store contract
        run: node scripts/verify-s04.mjs
      - name: Verify S05 policy and approval contract
        run: node scripts/verify-s05.mjs
      - name: Verify S06 boundary
        run: node scripts/verify-s06.mjs
      - name: Verify S07 boundary
        run: node scripts/verify-s07.mjs
      - name: Verify S08 boundary
        run: node scripts/verify-s08.mjs
      - name: Verify S09 boundary
        run: node scripts/verify-s09.mjs
      - name: Verify S10 boundary
        run: node scripts/verify-s10.mjs
      - name: Verify S11 boundary
        run: node scripts/verify-s11.mjs
      - name: Verify S12 boundary
        run: node scripts/verify-s12.mjs
      - name: Verify S13 boundary
        run: node scripts/verify-s13.mjs
      - name: Verify S14 boundary
        run: node scripts/verify-s14.mjs
      - name: Verify S15 boundary
        run: node scripts/verify-s15.mjs
      - name: Verify S16 boundary
        run: node scripts/verify-s16.mjs
      - name: Verify S17 boundary
        run: node scripts/verify-s17.mjs
      - name: Verify S18 boundary
        run: node scripts/verify-s18.mjs
      - name: Verify S19 boundary
        run: node scripts/verify-s19.mjs
      - name: Verify S20 boundary
        run: node scripts/verify-s20.mjs
      - name: Verify S21 boundary
        run: node scripts/verify-s21.mjs
      - name: Verify S22 boundary
        run: node scripts/verify-s22.mjs
      - name: Verify S23 boundary
        run: node scripts/verify-s23.mjs
      - name: Verify S24 production gate
        run: node scripts/verify-s24.mjs
      - name: Verify S25 desktop product baseline
        run: node scripts/verify-s25.mjs
      - name: Verify S26 codeoss bootstrap
        run: node scripts/verify-s26.mjs
      - name: Verify S27 supervision transport
        run: node scripts/verify-s27.mjs
      - name: Verify S28 desktop workbench shell
        run: node scripts/verify-s28.mjs
      - name: Verify S29 conversation and context
        run: node scripts/verify-s29.mjs
      - name: Verify S30 governed agent run
        run: node scripts/verify-s30.mjs
      - name: Verify S31 changes and evidence review
        run: node scripts/verify-s31.mjs
      - name: Verify S32 multi-agent worktrees
        run: node scripts/verify-s32.mjs
      - name: Verify S33 continuity and knowledge
        run: node scripts/verify-s33.mjs
      - name: Verify S34 armor evolution health
        run: node scripts/verify-s34.mjs
      - name: Test repository governance policy
        run: node --test scripts/tests/*.test.mjs
      - name: Verify Git whitespace contract
        # apps/desktop-codeoss/patches embeds upstream bytes verbatim
        # (tab-indented JSON context lines); it is the one place where
        # reformatting would break `git apply` fidelity.
        run: git diff --check HEAD^ -- . ':(exclude)apps/desktop-codeoss/patches'
