[package]
name = "saber-sync-e2ee"
description = "Client-key end-to-end-encrypted sync objects with per-object data keys, anti-rollback epochs and zero server-visible plaintext for Saber"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
publish = false

[dependencies]
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
getrandom = "=0.4.3"
saber-policy = { path = "../policy" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
zeroize = "=1.8.2"

[lints]
workspace = true
