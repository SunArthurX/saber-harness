[package]
name = "saber-plugin-registry"
description = "Governed plugin marketplace: digest-pinned manifests, a monotonic revocable registry and a boundary-only SDK surface for Saber"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
publish = false

[dependencies]
saber-effect-broker = { path = "../effect-broker" }
saber-orchestrator = { path = "../orchestrator" }
saber-policy = { path = "../policy" }
saber-sandbox = { path = "../sandbox" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[lints]
workspace = true
