[workspace]
members = [
    "crates/core-protocol",
    "crates/effect-broker",
    "crates/egress",
    "crates/cax",
    "crates/context-engine",
    "crates/event-store",
    "crates/evolution",
    "crates/memory-authority",
    "crates/model-providers",
    "crates/orchestrator",
    "crates/policy",
    "crates/resumption",
    "crates/saber-core",
    "crates/tool-broker",
    "crates/sandbox",
    "crates/secret-broker",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
authors = ["SunArthur"]
license-file = "LICENSE"
repository = "https://github.com/SunArthurX/saber-harness"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
