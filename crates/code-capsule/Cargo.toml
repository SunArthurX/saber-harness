[package]
name = "saber-code-capsule"
description = "Isolated typed Code Capsules with digest-pinned dependencies, declared grants, budget bounds and supersession history for Saber"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license-file.workspace = true
publish = false

[dependencies]
saber-evolution = { path = "../evolution" }
saber-memory-authority = { path = "../memory-authority" }
saber-orchestrator = { path = "../orchestrator" }
saber-policy = { path = "../policy" }
saber-sandbox = { path = "../sandbox" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[lints]
workspace = true
